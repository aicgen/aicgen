name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  # ----------------------------------------------------------------
  # JOB: VERIFY RELEASE SOURCE
  # ----------------------------------------------------------------
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate data package
        run: data/scripts/validate-data

      - name: Check embedded data freshness
        run: bun run check:embedded-data

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test -- --runInBand

      - name: Build package
        run: bun run build

  # ----------------------------------------------------------------
  # JOB: BUILD WINDOWS
  # ----------------------------------------------------------------
  release-windows:
    needs: verify-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - name: Build Windows Binary
        run: |
          bun install --frozen-lockfile
          bun run build:binary:windows

      - name: Setup NSIS
        run: |
          choco install nsis
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

          # Install EnVar Plugin
          Invoke-WebRequest -Uri "https://github.com/GsNSIS/EnVar/releases/download/v0.3.1/EnVar-Plugin.zip" -OutFile "envar.zip"
          Expand-Archive "envar.zip" -DestinationPath "envar_temp"
          Copy-Item "envar_temp\Plugins\x86-unicode\EnVar.dll" "C:\Program Files (x86)\NSIS\Plugins\x86-unicode\EnVar.dll"

      - name: Create Installer (NSIS)
        run: |
          makensis packaging/windows/setup.nsi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/aicgen-setup-x64.exe

  # ----------------------------------------------------------------
  # JOB: BUILD LINUX
  # ----------------------------------------------------------------
  release-linux:
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - name: Build Linux Binary
        run: |
          bun install --frozen-lockfile
          bun run build:binary:linux

      - name: Create Deb Package
        run: |
          mkdir -p dist/deb/usr/bin
          cp dist/aicgen-linux dist/deb/usr/bin/aicgen
          chmod +x dist/deb/usr/bin/aicgen

          mkdir -p dist/deb/DEBIAN
          cp packaging/linux/control dist/deb/DEBIAN/control

          dpkg-deb --build dist/deb dist/aicgen_amd64.deb

      - name: Create RPM Package
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp dist/aicgen-linux ~/rpmbuild/SOURCES/
          cp packaging/linux/aicgen.spec ~/rpmbuild/SPECS/

          rpmbuild -ba ~/rpmbuild/SPECS/aicgen.spec
          cp ~/rpmbuild/RPMS/x86_64/*.rpm dist/aicgen_x86_64.rpm

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            dist/aicgen_amd64.deb
            dist/aicgen_x86_64.rpm

  # ----------------------------------------------------------------
  # JOB: HOMEBREW BINARIES
  # Builds the macOS/Linux tarballs and attaches them to the release.
  # The tap formula itself is pushed by the last job (homebrew-tap), so a
  # tap credential problem can never block the npm or GitHub release.
  # ----------------------------------------------------------------
  homebrew-binaries:
    needs: verify-release
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha_macos_arm64: ${{ steps.sha256.outputs.macos_arm64 }}
      sha_macos_x64: ${{ steps.sha256.outputs.macos_x64 }}
      sha_linux_x64: ${{ steps.sha256.outputs.linux_x64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      # Bun cross-compiles, so one job builds every Homebrew target:
      # macOS arm64 and Intel, and Linux x64 (Linuxbrew).
      - name: Build Homebrew Binaries
        run: |
          bun install --frozen-lockfile
          bun run build:binary:macos
          bun run build:binary:macos-x64
          bun run build:binary:linux

      - name: Create Tarballs
        run: |
          package() {
            # $1 = built binary, $2 = tarball name
            rm -rf dist/homebrew && mkdir -p dist/homebrew
            cp "$1" dist/homebrew/aicgen
            chmod +x dist/homebrew/aicgen
            tar -czf "dist/$2" -C dist/homebrew aicgen
          }
          package dist/aicgen-macos aicgen-macos-arm64.tar.gz
          package dist/aicgen-macos-x64 aicgen-macos-x64.tar.gz
          package dist/aicgen-linux aicgen-linux-x64.tar.gz
          # Legacy asset name used by 1.x formulas (arm64).
          cp dist/aicgen-macos-arm64.tar.gz dist/aicgen-macos.tar.gz

      - name: Calculate SHA256
        id: sha256
        run: |
          echo "macos_arm64=$(shasum -a 256 dist/aicgen-macos-arm64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "macos_x64=$(shasum -a 256 dist/aicgen-macos-x64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "linux_x64=$(shasum -a 256 dist/aicgen-linux-x64.tar.gz | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Get Version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Tarballs to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/aicgen-macos-arm64.tar.gz
            dist/aicgen-macos-x64.tar.gz
            dist/aicgen-linux-x64.tar.gz
            dist/aicgen-macos.tar.gz

  # ----------------------------------------------------------------
  # JOB: HOMEBREW TAP
  # Runs last, after the GitHub release is published. Nothing depends on it.
  # ----------------------------------------------------------------
  homebrew-tap:
    needs: [homebrew-binaries, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew Tap
        env:
          # REQUIRED: A Personal Access Token (PAT) with 'public_repo' scope
          # stored in Settings > Secrets and variables > Actions > New repository secret
          # Name: GH_PAT
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          VERSION: ${{ needs.homebrew-binaries.outputs.version }}
          SHA_MACOS_ARM64: ${{ needs.homebrew-binaries.outputs.sha_macos_arm64 }}
          SHA_MACOS_X64: ${{ needs.homebrew-binaries.outputs.sha_macos_x64 }}
          SHA_LINUX_X64: ${{ needs.homebrew-binaries.outputs.sha_linux_x64 }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::GH_PAT secret is empty or missing"; exit 1
          fi

          # Clone the tap repository using the PAT
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/aicgen/homebrew-aicgen.git tap
          cd tap

          mkdir -p Formula

          # A formula (not a cask): aicgen is a command-line tool, and formulae
          # also serve Linuxbrew. Placeholders are replaced below.
          cat > Formula/aicgen.rb << 'EOF'
          class Aicgen < Formula
            desc "Configuration generator for AI coding assistants"
            homepage "https://github.com/aicgen/aicgen"
            version "@VERSION@"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/aicgen/aicgen/releases/download/v@VERSION@/aicgen-macos-arm64.tar.gz"
                sha256 "@SHA_MACOS_ARM64@"
              end
              on_intel do
                url "https://github.com/aicgen/aicgen/releases/download/v@VERSION@/aicgen-macos-x64.tar.gz"
                sha256 "@SHA_MACOS_X64@"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/aicgen/aicgen/releases/download/v@VERSION@/aicgen-linux-x64.tar.gz"
                sha256 "@SHA_LINUX_X64@"
              end
            end

            def install
              bin.install "aicgen"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/aicgen --version")
            end
          end
          EOF

          sed -i "s/@VERSION@/$VERSION/g; s/@SHA_MACOS_ARM64@/$SHA_MACOS_ARM64/g; s/@SHA_MACOS_X64@/$SHA_MACOS_X64/g; s/@SHA_LINUX_X64@/$SHA_LINUX_X64/g" Formula/aicgen.rb

          # Commit and push
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/aicgen.rb
          git commit -m "Update aicgen to version $VERSION" || echo "No changes to commit"
          git push

  # ----------------------------------------------------------------
  publish-npm:
    needs: [release-windows, release-linux, homebrew-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Build and Publish
        run: |
          bun install --frozen-lockfile
          bun run build
          npm publish --access public --tag latest

  # ----------------------------------------------------------------
  # JOB: PUBLISH RELEASE
  # ----------------------------------------------------------------
  publish-release:
    needs: [release-windows, release-linux, homebrew-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-installer/aicgen-setup-x64.exe
            linux-package/aicgen_amd64.deb
            linux-package/aicgen_x86_64.rpm
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Highlights in 2.0.0

            - Context-budgeted output: always-on files hold only commands and a guideline index; guidelines load as path-scoped rules or on-demand skills.
            - Full Rust support: nine guidelines for the 2024 edition, Cargo project analysis, cargo permissions and reviewers.
            - Valid, current output for Claude Code (hooks, rules, skills), GitHub Copilot (custom agents, skills, guard hook), Antigravity (`.agents/` rules and skills) and Codex (`AGENTS.md`, skills, portable plugin).
            - Re-running `aicgen init` migrates 1.x output and never touches your own files.
            - New security guidelines for supply chain and AI-assisted development; tooling guidelines for TypeScript, Python, Go, Java, C#, Ruby, Kotlin and PHP.
            - Requires Node.js 22 or newer when installed from npm.

            ## Installation

            ### Windows
            Download and run `aicgen-setup-x64.exe`

            ### Linux
            **Debian/Ubuntu**: `sudo dpkg -i aicgen_amd64.deb`
            **Fedora/RHEL**: `sudo rpm -i aicgen_x86_64.rpm`

            ### macOS (via Homebrew)
            ```bash
            brew tap aicgen/aicgen
            brew install aicgen
            ```

            ### All Platforms (via npm)
            ```bash
            npm install -g @aicgen/aicgen
            ```

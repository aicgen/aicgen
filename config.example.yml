# Example AICGEN Configuration File
#
# LOCATION: This file should be placed at:
#   - Windows: C:\Users\YourUsername\.aicgen\config.yml
#   - Linux/Mac: ~/.aicgen/config.yml
#
# INSTALLATION:
#   Windows:
#     mkdir C:\Users\%USERNAME%\.aicgen
#     copy config.example.yml C:\Users\%USERNAME%\.aicgen\config.yml
#
#   Linux/Mac:
#     mkdir -p ~/.aicgen
#     cp config.example.yml ~/.aicgen/config.yml
#
# Configuration priority: Environment Variables > User Config > Defaults

# GitHub repository configuration
github:
  owner: aicgen
  repo: aicgen-data

# AI Provider Configuration
# Customize models, timeouts, and behavior for different AI providers
ai:
  # Google Gemini Configuration
  gemini:
    # Model IDs change often; check https://ai.google.dev/gemini-api/docs/models
    model: gemini-3.8-flash
    # Examples (verified 2026-11-17):
    #   - gemini-3.8-flash (stable, fast, recommended default)
    #   - gemini-4-carbon (strongest reasoning)
    # gemini-2.5-* models are deprecated.

    # Request timeout in milliseconds
    timeout: 30000

    # Maximum retry attempts for failed requests
    maxRetries: 3

    # Maximum output tokens
    maxTokens: 8192

  # Anthropic Claude Configuration
  claude:
    # Model IDs: https://docs.anthropic.com/en/docs/about-claude/models
    model: claude-sonnet-5-5
    # Examples (verified 2026-11-17):
    #   - claude-sonnet-5-5 (best balance, recommended default)
    #   - claude-opus-5-5 (most capable)
    #   - claude-haiku-5-5 (fastest, cheapest)

    # Request timeout in milliseconds
    timeout: 30000

    # Maximum retry attempts
    maxRetries: 3

    # Maximum output tokens
    maxTokens: 8192

    # Temperature (0-1). Optional: omitted from requests unless set, because
    # some current models only accept their default value.
    # temperature: 0.5

  # OpenAI Configuration
  openai:
    # Model IDs: https://developers.openai.com/api/docs/models
    model: gpt-6-astra
    # Examples (verified 2026-11-17): gpt-6-astra (flagship), gpt-6.1-sol (balanced), gpt-6-luna (high volume)

    # Request timeout in milliseconds
    timeout: 30000

    # Maximum retry attempts
    maxRetries: 3

    # Maximum output tokens
    maxTokens: 4096

    # Temperature (0-2). Optional: omitted from requests unless set.
    # temperature: 0.5

  # Sub-Agent Configuration
  # Models for the Claude Code sub-agents aicgen generates (.claude/agents/*.md).
  # Use an alias (opus, sonnet, haiku, fable), a full model ID, or "inherit".
  # Aliases track the latest model of that tier. Sub-agents have no temperature
  # setting; a legacy `temperature:` key here is ignored.
  subAgents:
    # Guideline Checker - Verifies code follows project guidelines
    guidelineChecker:
      model: opus

    # Architecture Reviewer - Reviews architectural decisions
    architectureReviewer:
      model: sonnet

    # Security Auditor - Identifies security vulnerabilities
    securityAuditor:
      model: opus

# Alternative: Use environment variables instead
# Export these in your shell profile (.bashrc, .zshrc, etc.):
#
# # Gemini
# export AICGEN_GEMINI_MODEL=gemini-3.8-flash
# export AICGEN_GEMINI_TIMEOUT=60000
# export AICGEN_GEMINI_MAX_RETRIES=5
#
# # Claude
# export AICGEN_CLAUDE_MODEL=claude-opus-5-5
# export AICGEN_CLAUDE_TEMPERATURE=0.5
#
# # OpenAI
# export AICGEN_OPENAI_MODEL=gpt-6-astra
# export AICGEN_OPENAI_TEMPERATURE=0.5
#
# # Sub-Agents
# export AICGEN_SUBAGENT_GUIDELINE_MODEL=opus

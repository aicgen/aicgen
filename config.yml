github:
  owner: aicgen
  repo: aicgen-data

# AI Provider Configuration (all optional; see config.example.yml)
# Temperature is omitted unless you set it: some current models only accept
# their default value.
ai:
  gemini:
    model: gemini-3.8-flash
    timeout: 30000
    maxRetries: 3
    maxTokens: 8192

  claude:
    model: claude-sonnet-5-5
    timeout: 30000
    maxRetries: 3
    maxTokens: 8192

  openai:
    model: gpt-6-astra
    timeout: 30000
    maxRetries: 3
    maxTokens: 4096

  # Generated Claude Code sub-agents. Use an alias (opus, sonnet, haiku, fable),
  # a full model ID, or "inherit".
  subAgents:
    guidelineChecker:
      model: opus

    architectureReviewer:
      model: sonnet

    securityAuditor:
      model: opus
